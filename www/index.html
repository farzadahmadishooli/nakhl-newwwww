<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2f5d3a"><link rel="icon" href="icon-192.png"><title>نخل | حسابداری</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4efe3;--s:#fffdf7;--tx:#1f2a1c;--mu:#6b7061;--g:#2f5d3a;--r:#a63d2f;--ln:#ddd5bf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151a13;--s:#1e251b;--tx:#ece8da;--mu:#a2a893;--g:#8fc79a;--r:#e0796b;--ln:#33402e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151a13;--s:#1e251b;--tx:#ece8da;--mu:#a2a893;--g:#8fc79a;--r:#e0796b;--ln:#33402e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 Vazirmatn,Tahoma,sans-serif}
header{padding:14px 16px 0}h1{margin:0;font-size:30px;font-weight:800;color:var(--g)}h1 small{font-size:13px;color:var(--mu);font-weight:400;margin-right:8px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px}nav button{white-space:nowrap}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--s);border:1px solid var(--ln);border-radius:10px;padding:7px 12px;cursor:pointer}
button.on,button.p{background:var(--g);color:var(--bg);border-color:var(--g)}button.x{color:var(--r)}
main{padding:0 16px 40px;max-width:900px;margin:auto}
input,select,textarea{background:var(--s);border:1px solid var(--ln);border-radius:8px;padding:7px;width:100%}
.cards,.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.c,.bx{background:var(--s);border:1px solid var(--ln);border-radius:14px;padding:12px}.bx{margin:12px 0}
.c b{display:block;font-size:19px}.c span,.mu,label{color:var(--mu);font-size:13px}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:6px 8px;border-bottom:1px solid var(--ln);text-align:right;white-space:nowrap}th{color:var(--mu);font-weight:600}
td input,td select{min-width:90px}
.neg{color:var(--r)}.pos{color:var(--g)}h2{font-size:17px;margin:20px 0 6px}a{color:var(--g);cursor:pointer;font-weight:600}
.n,.dt{direction:ltr;text-align:left}.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}main>*{animation:up .4s ease both}.c{transition:transform .2s,box-shadow .2s}.c:hover{transform:translateY(-3px);box-shadow:0 6px 16px #0002}button{transition:transform .15s}button:active{transform:scale(.95)}#pv{display:none}.inv{background:#fff;color:#222;padding:24px;border-radius:12px}@media print{header,nav,main{display:none!important}body{background:#fff}#pv{display:block}}
</style></head><body>
<header><h1>🌴 نخل<small>پوشاک عمده · حسابداری</small></h1></header><nav id="nav"></nav><main id="app"></main><div id="pv"></div>
<script>
const K='nakhl-db';
const E={version:5,products:[],people:[],invoices:[],stockMoves:[],personMoves:[],partnerSetup:[{id:'p1',name:'فرزاد',share:50,capital:0},{id:'p2',name:'کیانوش',share:50,capital:0}],banks:[],bankMoves:[],checks:[],expenses:[],nextCode:1,nextInvoice:1,nextPerson:1,partnerMoves:[]};
let D,T='dash',A=null,cur={type:'sale',items:[{}]};
try{D=JSON.parse(localStorage.getItem(K))}catch(e){}
D=Object.assign(structuredClone(E),D||{});
const sv=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}dirBak()};
const $=i=>document.getElementById(i),uid=()=>crypto.randomUUID();
const P=s=>String(s).replace(/\d/g,c=>'۰۱۲۳۴۵۶۷۸۹'[c]);
const F=n=>P(Math.round(+n||0).toLocaleString('en'));
const L=s=>String(s??'').replace(/[۰-۹]/g,c=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(c)).replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c));
const N=s=>+L(s).replace(/[,٬،\s]/g,'')||0;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sum=(a,f)=>a.reduce((s,x)=>s+(+f(x)||0),0);
const z=n=>String(n).padStart(2,'0');
function g2j(gy,gm,gd){const g=[0,31,59,90,120,151,181,212,243,273,304,334];let jy=gy<=1600?0:979;gy-=gy<=1600?621:1600;const g2=gm>2?gy+1:gy;let d=365*gy+Math.floor((g2+3)/4)-Math.floor((g2+99)/100)+Math.floor((g2+399)/400)-80+gd+g[gm-1];jy+=33*Math.floor(d/12053);d%=12053;jy+=4*Math.floor(d/1461);d%=1461;if(d>365){jy+=Math.floor((d-1)/365);d=(d-1)%365}const jm=d<186?1+Math.floor(d/31):7+Math.floor((d-186)/30),jd=1+(d<186?d%31:(d-186)%30);return[jy,jm,jd]}
const today=()=>{const n=new Date(),[a,b,c]=g2j(n.getFullYear(),n.getMonth()+1,n.getDate());return a+'/'+z(b)+'/'+z(c)};
// تاریخ: همیشه YYYY/MM/DD شمسی
function ND(s){s=L(s||'').trim();let y,m,d;if(/^\d{8}$/.test(s)){y=s.slice(0,4);m=s.slice(4,6);d=s.slice(6)}else{const p=s.split(/\D+/).filter(Boolean);if(p.length<3)return'';[y,m,d]=p}
y=+y;m=+m;d=+d;if(y<1300||y>1500||m<1||m>12||d<1||d>(m<7?31:30))return'';return y+'/'+z(m)+'/'+z(d)}
const dt=(id,v)=>`<input id="${id}" class="dt" inputmode="numeric" maxlength="10" placeholder="۱۴۰۵/۰۱/۰۱" value="${P(v||'')}" oninput="fd(this)" onblur="vd(this)">`;
function fd(e){const d=L(e.value).replace(/\D/g,'').slice(0,8);e.value=P(d.length>6?d.slice(0,4)+'/'+d.slice(4,6)+'/'+d.slice(6):d.length>4?d.slice(0,4)+'/'+d.slice(4):d)}
function vd(e){if(!e.value)return;const n=ND(e.value);e.value=n?P(n):'';e.style.borderColor=n?'':'var(--r)'}
const pb=id=>(+D.people.find(x=>x.id==id)?.opening||0)+sum(D.personMoves.filter(m=>m.personId==id),m=>m.signedAmount);
const bk=id=>(+D.banks.find(x=>x.id==id)?.opening||0)+sum(D.bankMoves.filter(m=>m.bankId==id),m=>m.type=='in'?m.amount:-m.amount);
D.people.forEach(p=>{if(!p.code)p.code=D.nextPerson++});
const mig=()=>D.invoices.forEach(i=>{if(!D.personMoves.some(m=>m.invoiceId==i.id)){const b=i.type=='buy',pm=(t,a)=>D.personMoves.push({id:uid(),invoiceId:i.id,personId:i.personId,date:i.date,type:t,signedAmount:a,note:'فاکتور '+i.number});pm(b?'فاکتور خرید':'فاکتور فروش',b?-i.base:i.base);if(i.paid>0)pm((b?'پرداخت ':'دریافت ')+(i.method||''),b?i.paid:-i.paid)}});
mig();
const nextNo=t=>String(Math.max(t=='sale'?999:0,...D.invoices.filter(i=>i.type==t).map(i=>parseInt(L(i.number))||0))+1);
const nextCodeOf=a=>Math.max(0,...a.map(x=>parseInt(x.code)||0))+1;
const cashId=()=>{let b=D.banks.find(x=>x.name=='صندوق');if(!b){b={id:uid(),name:'صندوق',type:'صندوق',opening:0};D.banks.push(b)}return b.id};
const wd=p=>sum(D.partnerMoves.filter(m=>m.partnerId==p.id&&m.type.startsWith('برداشت')),m=>m.amount);
const pname=id=>{const p=D.products.find(x=>x.id==id);return p?p.code+' · '+p.name:''};
function pickP(i,e){const q=L(e.value).trim(),p=D.products.find(x=>x.code+' · '+x.name==q)||D.products.find(x=>String(x.code)==q)||D.products.find(x=>x.name==q)||D.products.find(x=>q&&x.name.includes(q));cur.items[i].pid=p?p.id:'';e.value=p?p.code+' · '+p.name:''}
const bal=v=>`<span class="${v>0?'pos':v<0?'neg':''}">${F(Math.abs(v))} ${v>0?'بدهکار':v<0?'بستانکار':''}</span>`;
const tbl=(h,r)=>`<div class="w"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')||'<tr><td colspan="9" class="mu">موردی ثبت نشده</td></tr>'}</table></div>`;
const opt=(a,v)=>'<option value="">—</option>'+a.map(x=>`<option value="${x.id}"${x.id==v?' selected':''}>${esc(x.name)}</option>`).join('');
const os=(a,v)=>a.map(x=>`<option${x==v?' selected':''}>${x}</option>`).join('');
const fld=(l,h)=>`<div><label>${l}</label>${h}</div>`;
const card=(l,v,c)=>`<div class="c"><span>${l}</span><b class="${c||''}">${F(v)}</b><span>تومان</span></div>`;

// ---------- داشبورد ----------
const tc=()=>sum(D.partnerSetup,p=>p.capital);
const shr=p=>tc()?p.capital/tc()*100:+p.share;
function dash(){const S=D.invoices.filter(i=>i.type=='sale'),sales=sum(S,i=>i.base),cogs=sum(S,i=>sum(i.items,t=>t.costOfGoods)),ex=sum(D.expenses,e=>e.amount),net=sales-cogs-ex;
const b=D.people.map(p=>pb(p.id)),ck=t=>sum(D.checks.filter(c=>c.type.startsWith(t)&&c.status!='پاس شد'),c=>c.amount);
return `${shortcuts()}<div class="cards">${card('فروش',sales)+card('بهای تمام‌شده کالای فروخته‌شده',cogs)+card('سود ناخالص',sales-cogs)+card('هزینه‌ها',ex)+card('سود خالص (پس از هزینه‌ها)',net,net<0?'neg':'pos')}</div>
<h2>وضعیت مالی</h2><div class="cards">${card('طلب از مشتریان',sum(b.filter(x=>x>0),x=>x))+card('بدهی به تأمین‌کنندگان',-sum(b.filter(x=>x<0),x=>x))+card('ارزش موجودی انبار',sum(D.products,p=>p.qty*p.cost))+card('موجودی حساب‌های بانکی',sum(D.banks,x=>bk(x.id)))+card('چک‌های دریافتی در جریان',ck('دریافتی'))+card('چک‌های پرداختی در جریان',ck('پرداختی'))}</div>
<h2>سود در بازه تاریخی</h2><div class='bx'><div class='g'>${fld('از تاریخ',dt('rf'))+fld('تا تاریخ',dt('rt'))}</div><br><button class='p' onclick='rng()'>محاسبه</button><p id='rr'></p></div><h2>سهم شرکا از سود خالص</h2>${tbl(['شریک','آورده','درصد سهم','سهم از سود','برداشت‌ها','مانده سهم'],D.partnerSetup.map(p=>[esc(p.name),F(p.capital),P(shr(p).toFixed(1))+'٪',F(net*shr(p)/100),F(wd(p)),F(net*shr(p)/100-wd(p))]))}`}

// ---------- فاکتور ----------
const IDS=['person','date','fm','fr','cash','bank','bankId','chk','chkNo','chkBank','chkDue','note','car','fpm','no','dm','dv'];
function snap(){IDS.forEach(i=>{const e=$(i);if(e)cur[i]=e.value})}
function calc(){snap();const b=cur.type=='buy',gross=sum(cur.items,t=>(t.qty||0)*(t.price||0)),ds=cur.dm=='percent'?gross*N(cur.dv)/100:cur.dm=='amount'?N(cur.dv):0,base=gross-Math.min(gross,ds),fre=!b?0:cur.fm=='percent'?base*N(cur.fr)/100:cur.fm=='amount'?N(cur.fr):0,cr=base-N(cur.cash)-N(cur.bank)-N(cur.chk);
$('sum').innerHTML=`جمع کالا: <b>${F(gross)}</b>${ds?` · تخفیف: <b>${F(Math.min(gross,ds))}</b> · پس از تخفیف: <b>${F(base)}</b>`:''}${b?` · کرایه: <b>${F(fre)}</b> · بهای تمام‌شده: <b>${F(base+fre)}</b>`:''} · اعتباری (باقی‌مانده): <b class="${cr<0?'neg':''}">${F(cr)}</b>`}
function invPage(){const b=cur.type=='buy',v=i=>esc(cur[i]??'');
const rows=cur.items.map((t,i)=>`<tr><td><input list='pl' value='${esc(pname(t.pid))}' placeholder='کد یا نام کالا' onchange='pickP(${i},this)'></td><td><input class="n" inputmode="decimal" value="${t.qty||''}" oninput="cur.items[${i}].qty=N(this.value);calc()"></td><td><input class="n" inputmode="decimal" value="${t.price||''}" oninput="cur.items[${i}].price=N(this.value);calc()"></td><td><button class="x" onclick="snap();cur.items.splice(${i},1);if(!cur.items.length)cur.items=[{}];R()">✕</button></td></tr>`).join('');
const list=[...D.invoices].sort((x,y)=>(y.date+y.createdAt).localeCompare(x.date+x.createdAt)).slice(0,40).map(i=>[P(i.number),P(i.date),i.type=='sale'?'فروش':'خرید',esc(i.person),F(i.total),i.type=='sale'?F(i.base-sum(i.items,t=>t.costOfGoods)):'—',esc(i.method),`<button onclick="editInv('${i.id}')">ویرایش</button> <button onclick="prt('${i.id}')">چاپ</button> <button class="x" onclick="delInv('${i.id}')">حذف</button>`]);
return `<datalist id='pl'>${D.products.map(p=>`<option value='${p.code} · ${esc(p.name)}'>`).join('')}</datalist>${cur.editId?`<div class='bx'>در حال ویرایش فاکتور ${P(cur.no)} — تسویه و چک را بررسی کنید. <button onclick='cur={type:cur.type,items:[{}]};R()'>انصراف</button></div>`:''}<div class="row"><button class="${b?'':'on'}" onclick="snap();cur.type='sale';cur.no='';R()">فاکتور فروش</button><button class="${b?'on':''}" onclick="snap();cur.type='buy';cur.no='';R()">فاکتور خرید</button></div>
<div class="bx" id="frm" oninput="calc()"><div class="g">${fld(b?'تأمین‌کننده':'مشتری',`<select id="person">${opt(D.people,cur.person)}</select>`)+fld('تاریخ',dt('date',cur.date||today()))+fld('شماره فاکتور',`<input id='no' class='n' value='${esc(cur.no||nextNo(cur.type))}'>`)}</div>
<h2>اقلام</h2><div class="w"><table><tr><th>کالا</th><th>تعداد</th><th>قیمت واحد</th><th></th></tr>${rows}</table></div><button onclick="snap();cur.items.push({});R()">+ ردیف</button><h2>تخفیف</h2><div class='g'>${fld('نوع',`<select id='dm'>${[['none','بدون تخفیف'],['percent','درصدی'],['amount','مبلغی']].map(o=>`<option value='${o[0]}'${cur.dm==o[0]?' selected':''}>${o[1]}</option>`).join('')}</select>`)+fld('درصد یا مبلغ',`<input id='dv' class='n' inputmode='decimal' value='${esc(cur.dv??'')}'>`)}</div>
${b?`<h2>کرایه (فقط خرید)</h2><div class="g">${fld('نوع',`<select id="fm">${[['none','بدون کرایه'],['amount','مبلغی'],['percent','درصدی از فاکتور']].map(o=>`<option value="${o[0]}"${cur.fm==o[0]?' selected':''}>${o[1]}</option>`).join('')}</select>`)+fld('مبلغ یا درصد',`<input id="fr" class="n" inputmode="decimal" value="${v('fr')}">`)+fld('باربر',`<select id='car'>${opt(D.people.filter(x=>x.type=='باربر'),cur.car)}</select>`)+fld('تسویه کرایه',`<select id='fpm'>${os(['اعتباری','نقد','حواله بانکی','چک'],cur.fpm)}</select>`)}</div>`:''}
<h2>تسویه (می‌تواند ترکیبی باشد)</h2><div class="g">${fld('نقد',`<input id="cash" class="n" inputmode="decimal" value="${v('cash')}">`)+fld('حواله بانکی',`<input id="bank" class="n" inputmode="decimal" value="${v('bank')}">`)+fld('حساب بانکی',`<select id="bankId">${opt(D.banks,cur.bankId)}</select>`)+fld('چک',`<input id="chk" class="n" inputmode="decimal" value="${v('chk')}">`)+fld('شماره چک',`<input id="chkNo" class="n" value="${v('chkNo')}">`)+fld('بانک چک',`<input id="chkBank" value="${v('chkBank')}">`)+fld('سررسید چک',dt('chkDue',cur.chkDue))}</div>
<p class="mu">هر مبلغی که تسویه نشود، به‌صورت اعتباری در حساب شخص ثبت می‌شود.</p>${fld('توضیحات',`<input id="note" value="${v('note')}">`)}
<p id="sum"></p><button class="p" onclick="saveInv()">ثبت فاکتور</button></div><h2>آخرین فاکتورها</h2>${tbl(['#','تاریخ','نوع','طرف حساب','مبلغ','سود','تسویه',''],list)}`}
function saveInv0(){snap();const o=cur,b=o.type=='buy',per=D.people.find(x=>x.id==o.person),d=ND(o.date),its=o.items.filter(t=>t.pid&&t.qty>0&&t.price>=0);
if(!per||!d||!its.length)return alert('طرف حساب، تاریخ معتبر و حداقل یک ردیف کالا لازم است');
const gross=sum(its,t=>t.qty*t.price),dm=o.dm||'none',dr=N(o.dv),disc=Math.min(gross,dm=='percent'?gross*dr/100:dm=='amount'?dr:0),base=gross-disc,fm=b?o.fm||'none':'none',fr=N(o.fr),fre=fm=='percent'?base*fr/100:fm=='amount'?fr:0,c=N(o.cash),bq=N(o.bank),ck=N(o.chk),cr=base-c-bq-ck;
if(cr<0)return alert('مجموع تسویه بیشتر از مبلغ فاکتور است');if(bq>0&&!o.bankId)return alert('حساب بانکی را انتخاب کنید');const car=D.people.find(x=>x.id==o.car),fp=o.fpm||'اعتباری';if(b&&fre>0&&!car)return alert('باربر را انتخاب کنید (در بخش اشخاص با نوع باربر تعریف کنید)');if(b&&fre>0&&fp=='حواله بانکی'&&!o.bankId)return alert('حساب بانکی را انتخاب کنید');
if(!b)for(const t of its){const p=D.products.find(x=>x.id==t.pid);if(p.qty<t.qty)return alert('موجودی کافی نیست: '+p.name)}
const id=uid(),no=L(o.no||'').trim()||nextNo(o.type);if(D.invoices.some(x=>x.type==o.type&&x.number==no))return alert('این شماره فاکتور قبلاً ثبت شده است');
const items=its.map(t=>{const p=D.products.find(x=>x.id==t.pid),dsc=gross?disc*t.qty*t.price/gross:0,bs=t.qty*t.price-dsc,fx=b&&base?fre*bs/base:0,it={productId:p.id,code:p.code,name:p.name,qty:t.qty,price:t.price,discount:dsc,base:bs,freight:fx,total:bs+fx};
if(b){p.cost=(Math.max(p.qty,0)*p.cost+bs+fx)/(Math.max(p.qty,0)+t.qty);p.qty+=t.qty;it.unitCost=(bs+fx)/t.qty;it.costOfGoods=0}else{it.unitCost=p.cost;it.costOfGoods=Math.round(t.qty*p.cost);p.qty-=t.qty}
D.stockMoves.push({id:uid(),invoiceId:id,date:d,type:b?'buy':'sale',productId:p.id,code:p.code,name:p.name,qty:t.qty,invoiceNo:no,person:per.name});return it});
const mv=(type,a)=>D.personMoves.push({id:uid(),invoiceId:id,personId:per.id,date:d,type,signedAmount:a,note:'فاکتور '+no});
mv(b?'فاکتور خرید':'فاکتور فروش',b?-base:base);
if(b&&fre>0){const cm=(type,a)=>D.personMoves.push({id:uid(),invoiceId:id,personId:car.id,date:d,type,signedAmount:a,note:'فاکتور خرید '+no});cm('کرایه فاکتور خرید',-fre);if(fp!='اعتباری'){cm('پرداخت کرایه ('+fp+')',fre);if(fp!='چک')D.bankMoves.push({id:uid(),invoiceId:id,date:d,bankId:fp=='نقد'?cashId():o.bankId,type:'out',amount:fre,note:'کرایه فاکتور '+no});else D.checks.push({id:uid(),invoiceId:id,type:'پرداختی به تأمین‌کننده',personId:car.id,person:car.name,no:o.chkNo||'',bank:o.chkBank||'',amount:fre,paid:0,spentAmount:0,date:d,due:ND(o.chkDue),status:'پاس نشده',note:'کرایه',installments:[],personBalanceApplied:true})}}
[['نقد',c],['حواله بانکی',bq],['چک',ck]].forEach(([m,a])=>{if(a>0)mv((b?'پرداخت ':'دریافت ')+m,b?a:-a)});
